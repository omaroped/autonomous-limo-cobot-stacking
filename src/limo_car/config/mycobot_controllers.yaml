controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    mycobot_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    mycobot_gripper_controller:
      type: position_controllers/JointGroupPositionController
    # NOTE: the base is driven by the gazebo_ros_diff_drive plugin (see ackermann.xacro),
    # NOT via ros2_control. Only the arm + gripper are ros2_control here.

mycobot_arm_controller:
  ros__parameters:
    joints:
      - joint2_to_joint1
      - joint3_to_joint2
      - joint4_to_joint3
      - joint5_to_joint4
      - joint6_to_joint5
      - joint6output_to_joint6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

mycobot_gripper_controller:
  ros__parameters:
    joints:
      - gripper_controller
      - gripper_base_to_gripper_left2
      - gripper_left3_to_gripper_left1
      - gripper_base_to_gripper_right3
      - gripper_base_to_gripper_right2
      - gripper_right3_to_gripper_right1
    interface_name: position
